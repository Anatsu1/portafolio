server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash de Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Modelos 3D de la celda: ya vienen comprimidos (meshopt + WebP), no se
    # les aplica gzip. Los nombres no llevan hash, así que cache de 30 días
    # revalidable (si se regenera un modelo, renombrarlo o limpiar la caché).
    location /models/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        types { model/gltf-binary glb; image/webp webp; }
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
