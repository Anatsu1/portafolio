server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
        # El HTML apunta a bundles con hash nuevo en cada deploy: siempre se
        # revalida (el 304 es barato) para no servir un index viejo con
        # assets que ya no existen.
        add_header Cache-Control "no-cache";
    }

    # Cache agresivo para assets con hash de Vite
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Modelos 3D de la celda: ya vienen comprimidos (meshopt + WebP), no se
    # les aplica gzip. Los nombres no llevan hash, así que cache de 30 días
    # revalidable (si se regenera un modelo, renombrarlo o limpiar la caché).
    location ^~ /models/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        types { model/gltf-binary glb; image/webp webp; }
    }

    # Iconos, OG y CV: sin hash en el nombre, cache corto revalidable.
    location ~* \.(ico|svg|png|pdf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
}
