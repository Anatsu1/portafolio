<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="augustofc">
  <!-- Placa blanca: el fondo sólido es lo que hace que el ícono se recorte
       entre pestañas. El borde gris no es decorativo — sobre una barra clara
       la placa se fundiría con el fondo del navegador sin él. -->
  <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#C4C8CE" stroke-width="2"/>
  <!-- "A" de nodos: mismo lenguaje que el árbol de skills del sitio. -->
  <g fill="none" stroke="#09090B" stroke-width="6" stroke-linecap="round">
    <path d="M32 14.5 L13 50.5"/>
    <path d="M32 14.5 L51 50.5"/>
    <path d="M19.6 38 H44.4"/>
  </g>
  <g fill="#09090B">
    <circle cx="32" cy="14.5" r="6.5"/>
    <circle cx="13" cy="50.5" r="6.5"/>
    <circle cx="51" cy="50.5" r="6.5"/>
  </g>
</svg>
